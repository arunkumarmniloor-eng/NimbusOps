apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nimbus-backend
  template:
    metadata:
      labels:
        app: nimbus-backend
    spec:
      containers:
      - name: nimbus-backend
        image: nimbus-backend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
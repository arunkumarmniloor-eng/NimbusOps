apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbusops
  labels:
    app: nimbusops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nimbusops
  template:
    metadata:
      labels:
        app: nimbusops
    spec:
      containers:
        - name: nimbusops
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
